<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flood Impacts on mobility and access to services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Flood Impacts on mobility and access to services</h1>
    </header>

    <div id="map-wrapper">
      <div id="map"></div>
      <div id="legend"></div>
    </div>
    <div id="controls">
    <b>Climate scenario</b><br>
    <label><input type="radio" name="rcp" value="rcp45" checked> RCP 4.5 (moderate)</label><br>
    <label><input type="radio" name="rcp" value="rcp85"> RCP 8.5 (high)</label>
    <hr>
    <b>Layers</b><br>
    <label><input type="checkbox" data-layer="flood" checked> Flood depth</label><br>
    <label><input type="checkbox" data-layer="transport"> Public transport</label><br>
    <label><input type="checkbox" data-layer="roads"> Road network</label>
    </div>
    <div id="popup" class="popup">
  <a href="#" id="popup-closer" class="popup-closer">&times;</a>
  <div id="popup-content"></div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <script src="main.js"></script>
  </body>
</html>
